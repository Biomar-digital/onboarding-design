<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Local look-dev render of the 3D Jutsu previs (scene_r5.glb): same animation and camera as Blender,
// with the real Vital AM bag swapped in, warm sky, underwater fog and light shafts.
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const W=+new URLSearchParams(location.search).get('w')||1280, H=Math.round(W*9/16);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H);
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.05; document.body.appendChild(r.domElement);
const s=new THREE.Scene();
// sky dome: deep blue top -> peach -> molten orange at the horizon
const sky=new THREE.Mesh(new THREE.SphereGeometry(150,48,24),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 p; void main(){p=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`varying vec3 p; void main(){ float h=p.y; vec3 hor=vec3(1.0,0.55,0.22), mid=vec3(0.98,0.72,0.5), top=vec3(0.25,0.38,0.62);
   float sunb=pow(max(dot(normalize(p),normalize(vec3(0.06,0.04,-1.))),0.),40.);
   vec3 c=mix(hor,mid,smoothstep(0.,0.12,h)); c=mix(c,top,smoothstep(0.12,0.6,h)); c+=vec3(1.,0.6,0.25)*sunb*1.4;
   if(h<0.) c=vec3(0.05,0.12,0.12); gl_FragColor=vec4(c,1.);}`}));
s.add(sky);
const skyScene=new THREE.Scene(); skyScene.add(sky.clone());
const pm=new THREE.PMREMGenerator(r); const envAir=pm.fromScene(skyScene,0.02).texture;
const hemi=new THREE.HemisphereLight(0xffc49a,0x20302c,0.9); s.add(hemi);
const sun=new THREE.DirectionalLight(0xffb066,2.6); sun.position.set(3,4,-60); s.add(sun);
const fill=new THREE.DirectionalLight(0xffe0c0,0.6); fill.position.set(-2,3,6); s.add(fill);
const fogAir=new THREE.FogExp2(0xf2a46a,0.012), fogWater=new THREE.FogExp2(0x1f5348,0.5);
// underwater god rays: additive open cones hanging from the surface
const rays=new THREE.Group(); const rayMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
  uniforms:{a:{value:0.13}},vertexShader:'varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform float a; varying vec2 vUv; void main(){ float e=sin(vUv.x*6.2831*3.)*.5+.5; gl_FragColor=vec4(vec3(1.,.82,.5)*a*pow(vUv.y,1.6)*(1.-smoothstep(.8,1.,vUv.y))*(.4+.6*e),1.);}'});
for(let i=0;i<7;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(0.25+Math.random()*0.2,0.05,1.7,24,1,true),rayMat);
  c.position.set(-1.7+i*0.55+Math.random()*0.2,-0.85,-0.3-Math.random()*1.6); c.rotation.z=0.18; c.rotation.x=-0.12; rays.add(c);} s.add(rays);
const comp=new EffectComposer(r); let cam;
const L=new GLTFLoader();
const [scene,bagG]=await Promise.all([L.loadAsync('scene_r5.glb'),L.loadAsync('SmartCare_Vital_AM_Bag.glb')]);
s.add(scene.scene);
const get=n=>scene.scene.getObjectByName(n);
get('ENV_Underwater_Volume').visible=false;
const proxy=get('HERO_VitalAM_Bag_10kg'); proxy.visible=false;
const bag=bagG.scene; bag.position.set(proxy.position.x, proxy.position.y-0.36-0.007, proxy.position.z); s.add(bag);
scene.scene.traverse(o=>{ if(o.isLight) o.visible=false;
  if(o.isMesh){ const n=o.name+'|'+(o.parent?.name||''); const m=o.material;
    if(n.includes('Water_Surface')){ o.geometry.computeVertexNormals(); window.water=o;
      o.userData.air=new THREE.MeshStandardMaterial({color:0x2c3a30,emissive:0x5a3214,emissiveIntensity:0.55,roughness:0.15,metalness:0.0,transparent:true,opacity:0.92,envMapIntensity:2.0});
      o.userData.under=new THREE.MeshBasicMaterial({color:0xd2f0dc,transparent:false,opacity:1,side:THREE.DoubleSide});
      o.material=o.userData.air; }
    if(n.includes('Sun_Disc')){ o.material=new THREE.MeshBasicMaterial({color:new THREE.Color(1.0,0.86,0.6).multiplyScalar(4),fog:false}); window.sunDisc=o; }
    if(n.includes('SHRIMP')||(m&&m.name&&m.name.includes('Shrimp'))){ o.material=new THREE.MeshStandardMaterial({color:0xe8ece4,emissive:0x6a7a70,emissiveIntensity:0.5,roughness:0.3}); o.scale.multiplyScalar(1.5); }
    if(n.includes('Bank')||n.includes('Tree')){ o.material=new THREE.MeshBasicMaterial({color:0x3a2416}); }
  }});
// soft water-surface sheen of the sun: a long additive glint plane
const glint=new THREE.Mesh(new THREE.PlaneGeometry(1.4,40),new THREE.MeshBasicMaterial({color:0xffb060,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false}));
glint.rotation.x=-Math.PI/2; glint.position.set(3.0,0.003,-30); s.add(glint);
scene.scene.traverse(o=>{ if(o.isCamera) cam=o; }); cam.aspect=W/H; cam.updateProjectionMatrix();
// sun glow sprite instead of a bloom pass (bloom is unstable on the software GL renderer)
const gc=document.createElement('canvas'); gc.width=gc.height=256; const g2=gc.getContext('2d');
const grd=g2.createRadialGradient(128,128,0,128,128,128); grd.addColorStop(0,'rgba(255,240,210,1)'); grd.addColorStop(0.18,'rgba(255,200,130,0.65)'); grd.addColorStop(0.5,'rgba(255,150,70,0.18)'); grd.addColorStop(1,'rgba(255,120,40,0)');
g2.fillStyle=grd; g2.fillRect(0,0,256,256);
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(gc),blending:THREE.AdditiveBlending,depthWrite:false,fog:false,transparent:true}));
const sp=get('ENV_Sun_Disc').getWorldPosition(new THREE.Vector3()); glow.position.copy(sp); glow.scale.set(26,26,1); s.add(glow);
const mixer=new THREE.AnimationMixer(scene.scene); scene.animations.forEach(c=>mixer.clipAction(c).play());
window.shot=f=>{ mixer.setTime((f-1)/24); scene.scene.updateMatrixWorld(true);
  const wp=new THREE.Vector3(); cam.getWorldPosition(wp); const under=wp.y<0;
  s.fog=under?fogWater:fogAir; sky.visible=!under; s.background=under?new THREE.Color(0x1f5348):null;
  s.environment=under?null:envAir; window.water.material=under?window.water.userData.under:window.water.userData.air; if(window.sunDisc) window.sunDisc.visible=!under; rays.visible=under; glint.visible=!under; hemi.color.set(under?0x9fe0c8:0xffc49a); hemi.intensity=under?1.4:0.9;
  glow.visible=!under;
  r.render(s,cam); return r.domElement.toDataURL('image/jpeg',0.92);};
window.ready=true;
</script></body></html>
