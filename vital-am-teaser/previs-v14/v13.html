function droneCam(f){ const u=f-97,U=43,k=0.045; const gk=u<=U?Math.exp(-k*u)-(u/U)*Math.exp(-k*U):0; const z=SHP.z+(64-SHP.z)*Math.max(0,gk);
  const e=smo(99,138,f); const rx=0.002+(RX1-0.002)*smo(104,136,f), rz=Math.PI+(RZ1-Math.PI)*smo(103,136,f);
  const push=0.45*smo(138,158,f), F=new THREE.Vector3(-Math.sin(rz)*Math.sin(rx),Math.cos(rz)*Math.sin(rx),-Math.cos(rx));
  const Y0=+(P.get('y0')||0.1); return {p:B2T(SHP.x*e+F.x*push,Y0+(SHP.y-Y0)*e+F.y*push,z+F.z*push),q:qBl(rx,rz),mm:24+8*smo(120,140,f)}; }
// chase: beside/behind the hero pellet, closing in from the scoop to ~7.5 cm; dives with it and settles above it as it sinks
const R0=scoopAt(HF0).clone(); const DIR=V(LAND.x-R0.x,0,LAND.z-R0.z).normalize(); const UPV=V(0,1,0); let SIDE=DIR.clone().cross(UPV).normalize();
{ const fr=V(0,0,0); get('FARMER_Root').getWorldPosition(fr); if(R0.clone().sub(fr).dot(SIDE)<0) SIDE.negate(); }
let APEX=HF0, ay=-1e9; for(let f=HF0;f<=HFL;f++){ const p=heroAir(f); if(p.y>ay){ ay=p.y; APEX=f; } }
const heroP=f=>{ if(f<HF0) return scoopAt(f).clone(); const o=V(0,0,0); if(pelAt(HERO,f,o)===null) return mouth(HERO_SH,f).clone(); return o; };
// the hero shrimp's side (horizontal), facing the S5 rise, measured when it takes the pellet
const SDH=(()=>{ setF(TE_HERO); const h=USHR[HERO_SH].userData.holder, q=new THREE.Quaternion(); h.getWorldQuaternion(q);
  const fw=V(1,0,0).applyQuaternion(q), sd=V(fw.z,0,-fw.x).normalize(); const s5=V(0,0,0); camOf('CAM_S5_Reveal').getWorldPosition(s5); const M=mouth(HERO_SH,TE_HERO);
  setF(300); const s5b=V(0,0,0); camOf('CAM_S5_Reveal').getWorldPosition(s5b); if(s5b.clone().sub(M).dot(sd)<0) sd.negate(); return sd; })();
function chaseCam(f){ const H=heroP(f); const air=f<=HFL;
  const d=air?0.075+0.9*(1-smo(160,172,f)):0.075+0.035*smo(HFL+4,262,f);
  let upk=-0.12+0.4*smo(HFL-10,HFL,f);
  if(!air) upk=0.28;
  const side=air?0.4+0.6*(1-smo(156,170,f)):0.4;
  const B=DIR.clone().multiplyScalar(-0.9).addScaledVector(SIDE,side).normalize();
  if(!air){ const a0=Math.atan2(B.z,B.x), a1=Math.atan2(SDH.z,SDH.x); const w=smo(232,TE_HERO,f); const a=a0+wrapA(a1-a0)*w; B.set(Math.cos(a),0,Math.sin(a)); }
  const dd=air?d:d+0.15*smo(TE_HERO-14,TE_HERO+2,f);
  const p=H.clone().addScaledVector(B,dd).addScaledVector(UPV,upk*dd);
  return {p,q:qLook(p,H),mm:32+18*smo(158,174,f)-10*smo(TE_HERO-14,TE_HERO+2,f)}; }
const s5mm=f=>f<=316?56+(30-56)*smo(289,316,f):30+(38-30)*smo(316,360,f);
const HSH=USHR[HERO_SH];
function eatCam(f){ const hd=HSH.userData.holder, q=new THREE.Quaternion(); hd.getWorldQuaternion(q);
  const fw=V(1,0,0).applyQuaternion(q), up=V(0,1,0).applyQuaternion(q), sd=fw.clone().cross(up).normalize();
  const M=mouth(HERO_SH,f).clone(); const s5=pose('CAM_S5_Reveal').p; if(s5.clone().sub(M).dot(sd)<0) sd.negate();
  const p=M.clone().addScaledVector(sd,0.13).addScaledVector(up,0.02).addScaledVector(fw,0.03);
  return {p,q:qLook(p,M.clone().addScaledVector(fw,-0.02)),mm:40}; }
const mix=(a,b,w)=>({p:a.p.clone().lerp(b.p,w),q:a.q.clone().slerp(b.q,w),mm:a.mm+(b.mm-a.mm)*w});

// ---------- ending as one move: catch (25 cm) -> group feeding, backlit like the reference (70 cm) -> rise to the jetty -> bag at sunrise ----------
const BAGP=V(0,0,0); get('HERO_VitalAM_Bag_10kg').getWorldPosition(BAGP);
const MTE=mouth(HERO_SH,TE_HERO).clone();
const PG=MTE.clone().add(V(0.05,0.03,0.70)), TG=MTE.clone().add(V(0.0,0.13,-0.25));            // group shot: camera on the sun-facing side, looking slightly up
const PS=V(BAGP.x+0.05,-0.06,BAGP.z+2.35), TS=V(BAGP.x,0.75,BAGP.z-0.6);                        // just under the surface, facing the jetty posts
const PE=V(BAGP.x+0.05,0.62,BAGP.z+2.05), TE=V(BAGP.x,BAGP.y+0.22,BAGP.z);                      // above water: bag on the jetty, sun behind
function endCam(f){ let p,t,mm;
  if(f<=300){ const a=chaseCam(f), w=smo(TE_HERO+4,300,f); const tH=heroP(f); p=a.p.clone().lerp(PG,w); t=tH.clone().lerp(TG,w); mm=a.mm+(32-a.mm)*w; }
  else if(f<=320){ const w=smo(300,320,f); const wy=smo(302,320,f); p=V(PG.x+(PS.x-PG.x)*w, PG.y+(PS.y-PG.y)*wy, PG.z+(PS.z-PG.z)*w); t=TG.clone().lerp(TS,smo(302,320,f)); mm=32-4*w; }
  else { const w=smo(320,342,f); p=PS.clone().lerp(PE,w); p.y=PS.y+(PE.y-PS.y)*smo(320,334,f); t=TS.clone().lerp(TE,smo(320,330,f)); mm=28+10*smo(336,360,f); }
  return {p,q:qLook(p,t),mm}; }
const g5=f=>f<=312?f:(f<=318?312+(f-312)*15/6:327+(f-318)*33/42);
function s5Pose(f){ const g=g5(f); if(Math.abs(g-f)<1e-6) return pose('CAM_S5_Reveal'); mixer.setTime((g-1)/FPS); G.scene.updateMatrixWorld(true); const r=pose('CAM_S5_Reveal'); mixer.setTime((f-1)/FPS); G.scene.updateMatrixWorld(true); clampShrimp(); return r; }
window.__camOv=f=>{ if(f<84) return null; let c;
  if(f<=96.5) c=phoneCam(f);
  else if(f<157) c=droneCam(f);
  else if(f<=168) c=mix(droneCam(f),chaseCam(f),smo(157,168,f));
  else if(f<TE_HERO+4) c=chaseCam(f);
  else c=endCam(f);
  vc.position.copy(c.p); vc.quaternion.copy(c.q); vc.userData.mm=c.mm; vc.updateMatrixWorld(true); return vc; };
window.__camInfo={APEX,HF0,HFL,DIR:DIR.toArray(),SIDE:SIDE.toArray()};


const SEG=[[1,48,0.8],[49,96,0.85],[97,138,0.85],[139,160,0.5],[161,190,0.6],[191,270,0.8],[271,305,0.55],[306,360,0.68]];
const spd=f=>{ let v=0.8; for(const [a,b,k] of SEG) if(f>=a-0.5&&f<b+0.5) v=k; return v; };
const TMAP=[1]; { let f=1; while(f<360){ let k=0,n=0; for(let d=-6;d<=6;d++){ k+=spd(f+d); n++; } f=Math.min(360,f+k/n); TMAP.push(f); } }
window.__NOUT=TMAP.length; window.shotOut=F=>window.shot(TMAP[Math.max(0,Math.min(TMAP.length-1,F-1))]);
window.__tmap=F=>TMAP[F-1];
window.ready=true;
</script></body></html>
