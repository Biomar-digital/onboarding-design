<script>
const clamp=x=>Math.max(0,Math.min(1,x));
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const prog=(t,s,d)=>clamp((t-s)/d);
const L=[...document.querySelectorAll('.lt')];
// loading curve: quick start, a short hesitation, then completes
function load(t){const p=prog(t,1.7,3.1);
  const k=[[0,0],[.25,.38],[.45,.52],[.6,.56],[.85,.9],[1,1]];
  for(let i=1;i<k.length;i++) if(p<=k[i][0]){const a=(p-k[i-1][0])/(k[i][0]-k[i-1][0]);return k[i-1][1]+(k[i][1]-k[i-1][1])*easeInOut(a)}
  return 1}
window.render=function(t){
  L.forEach((g,i)=>{const p=prog(t,0.15+i*0.07,0.55),e=easeOutBack(p);
    g.style.opacity=clamp(p*2.5); g.setAttribute('transform',`translate(0 ${(1-e)*260})`)});
  document.getElementById('sw').setAttribute('stroke-dashoffset',1-easeInOut(prog(t,0.75,0.9)));
  const b=prog(t,1.45,0.35); const bar=document.getElementById('bar');
  bar.style.opacity=b; bar.style.transform=`scaleX(${0.6+0.4*easeOut(b)})`;
  document.getElementById('fill').style.width=(load(t)*100)+'%';
};
render(0);
</script></body></html>
