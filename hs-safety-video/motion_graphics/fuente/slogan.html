<!doctype html>
<html><head><meta charset="utf-8"><title>Slogan</title>
<style>
@font-face{font-family:Avenir;src:url(AvenirNextLTPro-Bold.otf);font-weight:700}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
body{font-family:Avenir,Arial,sans-serif}
.row{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;gap:34px}
.chip{background:#fff;border-radius:999px;height:112px;padding:0 46px 0 22px;display:flex;align-items:center;gap:20px;
  box-shadow:0 8px 24px rgba(31,62,119,.2);opacity:0}
.chip svg{width:72px;height:72px}
.chip span{font-weight:700;font-size:50px;letter-spacing:.01em;color:#1f3e77;white-space:nowrap}
</style></head><body>
<div class="row">
  <!-- eye -->
  <div class="chip" id="c0"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#0471ad"/><path fill="#fff" d="M32 19c-10 0-18 7-21 13 3 6 11 13 21 13s18-7 21-13c-3-6-11-13-21-13z"/><circle cx="32" cy="32" r="7.5" fill="#0471ad"/><circle cx="32" cy="32" r="3.2" fill="#fff"/></svg><span>See it.</span></div>
  <!-- report: clipboard -->
  <div class="chip" id="c1"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#0471ad"/><path fill="#fff" d="M22 17h6a4 4 0 0 1 8 0h6a2 2 0 0 1 2 2v28a2 2 0 0 1-2 2H22a2 2 0 0 1-2-2V19a2 2 0 0 1 2-2z"/><path fill="#0471ad" d="M27 15.5h10v5H27z"/><path fill="#0471ad" d="M25 27h14v3H25zM25 33h14v3H25zM25 39h9v3h-9z"/></svg><span>Report it.</span></div>
  <!-- prevent: shield with tick -->
  <div class="chip" id="c2"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#97d130"/><path fill="#fff" d="M32 13l15 6v11c0 10-6.5 17.5-15 21-8.5-3.5-15-11-15-21V19z"/><path fill="#97d130" d="M29.5 39.5l-7-7 3.2-3.2 3.8 3.8 9-9 3.2 3.2z"/></svg><span>Prevent it.</span></div>
</div>
<script>
const clamp=x=>Math.max(0,Math.min(1,x));
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const T=[0.15,0.85,1.55];
window.render=function(t){
  T.forEach((s,i)=>{const el=document.getElementById('c'+i), p=clamp((t-s)/0.55), e=easeOutBack(p);
    el.style.opacity=clamp(p*2.2); el.style.transform=`translateY(${(1-e)*30}px) scale(${0.6+0.4*e})`});
};
render(0);
</script></body></html>
